services:
  miraie-ac:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miraie-ac
    restart: unless-stopped

    ports:
      # Expose locally too — useful for LAN access without the tunnel
      - "8001:8001"

    environment:
      # ── Required ──────────────────────────────────────────────────
      MIRAIE_PORT: "8001"

      # ── Optional: lock the API behind a token ──────────────────────
      # Uncomment and set to a strong random string:
      # MIRAIE_API_TOKEN: "change-me-to-something-secret"

    volumes:
      # ── Persistent data (survives container rebuilds) ──────────────
      # Session file (generated by --setup; must exist before first run)
      - ./miraie/miraie_session.json:/app/miraie/miraie_session.json

      # AC state (power/temp/mode/fan — updated on every control action)
      - ./miraie/ac_state.json:/app/miraie/ac_state.json

      # Schedules JSON (cron definitions)
      - ./miraie/miraie_schedules.json:/app/miraie/miraie_schedules.json

      # Profiles / scheduler settings
      - ./miraie/ac_profiles.json:/app/miraie/ac_profiles.json:ro
      - ./miraie/scheduler_settings.json:/app/miraie/scheduler_settings.json

      # Logs directory (web.log + cloudflared.log visible on host)
      - ./miraie/logs:/app/miraie/logs

    # Nice labels for `docker ps`
    labels:
      - "com.eagent.service=miraie-ac-control"
      - "com.eagent.description=Panasonic MirAIe AC controller + Cloudflare tunnel"
